# Một origin cho cả giao diện và API (giống proxy của Vite khi chạy dev – TD-15)
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000;   # "api" là TÊN DỊCH VỤ trong docker-compose, không phải localhost
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Ứng dụng một trang: mọi đường dẫn khác (/khao-sat/..., /phan-hoi) trả index.html
  location / {
    try_files $uri /index.html;
  }
}
